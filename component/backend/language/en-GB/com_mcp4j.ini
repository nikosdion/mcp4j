COM_MCP4J="MCP4j"
COM_MCP4J_CONTROLPANEL_INTRO="MCP4j turns this Joomla site into a remote, HTTP-based Model Context Protocol (MCP) server."
COM_MCP4J_CONFIG_OPTIONS_GENERAL_LABEL="General Options"
COM_MCP4J_CONFIG_SESSION_TTL_LABEL="Session Lifetime"
COM_MCP4J_CONFIG_SESSION_TTL_DESC="How long, in seconds, an idle MCP session remains valid before it must be re-initialised. Default: 3600 (one hour)."
COM_MCP4J_CONFIG_PRUNE_ON_REQUEST_LABEL="Prune Sessions on Every Request"
COM_MCP4J_CONFIG_PRUNE_ON_REQUEST_DESC="When enabled, every MCP request also deletes expired session rows, briefly locking the sessions table to do so. &lt;strong&gt;This is not the recommended way to keep the sessions table tidy&lt;/strong&gt; — install and enable the “MCP4j — Prune expired sessions” Scheduled Task instead (System, Scheduled Tasks), which runs the same clean-up on a schedule without adding locking overhead to every request. Leave this off unless you cannot use Scheduled Tasks."
COM_MCP4J_CONFIG_DEBUG_LOG_LABEL="Debug Log"
COM_MCP4J_CONFIG_DEBUG_LOG_DESC="When enabled, every tool call writes its tool name and arguments (with any protected secret substring replaced by “***”) to a dedicated &lt;code&gt;administrator/logs/mcp4j.php&lt;/code&gt; log file. Tool call &lt;strong&gt;results&lt;/strong&gt; are never logged, even when this is on — some tools legitimately return credentials to the caller (for example, a freshly generated temporary Super User password) and these must never be written to disk."
COM_MCP4J_CONFIG_FORBIDDEN_SECRETS_LABEL="Forbidden Secrets"
COM_MCP4J_CONFIG_FORBIDDEN_SECRETS_DESC="One value per line. Every non-read-only tool call's arguments are checked for these values as substrings before the tool runs; a match is refused with a “secrets leak prevented” error instead of being executed. The current request's own API token and, when at least 8 characters long, this site's configured Secret Word, mail/FTP/proxy/Redis passwords are always protected in addition to whatever you list here — you do not need to repeat them."
COM_MCP4J_CONFIG_MINIMAL_SCHEMA_LABEL="Minimal Tool Schemas"
COM_MCP4J_CONFIG_MINIMAL_SCHEMA_DESC="When enabled, every tool's advertised input schema is reduced to just each parameter's type and default value, dropping descriptions, enums and other constraints. This meaningfully reduces the size of the &lt;code&gt;tools/list&lt;/code&gt; response for LLMs with a limited context window, at the cost of the LLM having fewer hints about how to call each tool correctly."
COM_MCP4J_CONFIG_OPTIONS_TOOLS_LABEL="Tools"
COM_MCP4J_CONFIG_READ_ONLY_LABEL="Read-Only Mode"
COM_MCP4J_CONFIG_READ_ONLY_DESC="When enabled, only tools annotated as read-only are exposed — every tool that can create, change or delete anything is hidden. This is applied last, after the category and allow-list filters below, so it always narrows (never widens) whatever those already selected."
COM_MCP4J_CONFIG_TOOL_ALLOWLIST_LABEL="Tool Allow-List"
COM_MCP4J_CONFIG_TOOL_ALLOWLIST_DESC="One exact tool name per line. When this list is not empty it completely overrides the category selection above — only the tools named here (that also meet their own requirements) are exposed, regardless of which categories are ticked."
COM_MCP4J_CONFIG_TOOL_CATEGORIES_LABEL="Tool Categories"
COM_MCP4J_CONFIG_TOOL_CATEGORIES_DESC="Tick the tool categories to expose over MCP. Leave every box unticked to expose all categories (this is the default). Ignored entirely when the Tool Allow-List below is not empty."
