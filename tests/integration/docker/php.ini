; Test-tuned PHP settings for the MCP4j integration harness.
; Opposite of a production ini: errors visible, generous limits.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

memory_limit = 512M
max_execution_time = 0

; Deliberately NOT UTC. A real bug was found in this project (see
; .claude/mcp-session-handling.md and SessionClockTest) where session expiry
; was compared with PHP's strtotime(), which reads naive datetime strings in
; the process's *default* timezone rather than UTC. Forcing this container's
; default timezone to UTC would quietly mask that whole bug class from the
; integration suite even though the unit suite (SessionClockTest) already
; runs under a non-UTC default timezone for the same reason. Keep them in
; sync: whatever timezone SessionClockTest sets, this should too.
date.timezone = Europe/Athens

phar.readonly = Off
