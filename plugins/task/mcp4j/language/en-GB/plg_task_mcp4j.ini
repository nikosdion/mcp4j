PLG_TASK_MCP4J="Scheduled Tasks - MCP4j"
PLG_TASK_MCP4J_PRUNESESSIONS_TITLE="MCP4j - Prune expired sessions"
PLG_TASK_MCP4J_PRUNESESSIONS_DESC="Deletes expired MCP4j session records. This is the recommended way to keep the #__mcp4j_sessions table tidy — prefer this over enabling the “Prune Sessions on Every Request” option on the MCP4j Options page, which locks the sessions table on every MCP request instead of on a schedule."
